<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
   
    <title>Advanto Software</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url('background1.jpg') no-repeat center center/cover;
            color: #bccff8;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar img {
            max-width: 120px;
            height: auto;
        }

        .heading {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #000;
            margin: 0;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            margin-right:40px;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        .carousel-container img {
            width: 100px;
            height: auto;
            background-color: #fff;
            margin-right: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .carousel-container img:hover {
            transform: scale(1.1);
        }

        .login-section {
            background-color: rgba(11, 11, 11, 0.73);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            text-align: center;
            margin-top: 70px;
        }

        .login-section h2 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .login-section .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .login-section button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #1061b8;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .login-section button:hover {
            background-color: #3e8e41;
            text-decoration: none;
        }

        .login-section button a {
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
        }

        .login-section .forgot-password {
            margin-top: 10px;
            display: block;
            font-size: 0.9rem;
            text-decoration: none;
            color: #007bff;
        }

        .login-section .forgot-password:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .navbar img {
                max-width: 90px;
            }

            .carousel-container img {
                width: 80px;
            }

            .login-section {
                padding: 20px;
            }

            .login-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <img src="logo1.png" alt="Institute Logo">
        <div class="heading">Our Co-operation with:</div>
        <div class="carousel-container">
            <img src="https://advantosoftware.com/wp-content/uploads/2022/05/08.png" alt="08">
            <img src="https://advantosoftware.com/wp-content/uploads/2022/05/09.png" alt="09">
            <img src="https://advantosoftware.com/wp-content/uploads/2022/05/01.png" alt="01">
            <img src="https://advantosoftware.com/wp-content/uploads/2022/05/02.png" alt="02">
            <img src="https://advantosoftware.com/wp-content/uploads/2022/05/03.png" alt="03">
            <img src="https://advantosoftware.com/wp-content/uploads/2022/05/04.png" alt="04">
            <img src="https://advantosoftware.com/wp-content/uploads/2022/05/05.png" alt="05">
            <img src="https://advantosoftware.com/wp-content/uploads/2022/05/06.png" alt="06">
        </div>
    </div>

    <div class="login-section">
        <h2>Login</h2>
        <form>
            <div class="form-group">
                <label for="email">Email ID:</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <a href="forgot-pass.html" class="forgot-password">Forgot Password?</a>
            <button type="button" class="btn btn-primary mt-3"><a href="login.html">Login as Admin</a></button>
            <button type="button" class="btn btn-secondary mt-2"><a href="login.html">Login as Sub-Admin</a></button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kQtW33rZJAHjgefvhyyzcGF7sz1MBoORZU4PQSHh9D1FL2EGp7EwnzF8t4wUrnb" crossorigin="anonymous"></script>
</body>
</html>
