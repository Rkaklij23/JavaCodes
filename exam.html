<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #4444a39b;
        }

        .container {
            padding: 20px;
        }

        .exam-card {
            margin-bottom: 20px;
        }

        .launch-btn, .delete-btn {
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .launch-btn {
            background-color: #28a745;
            color: white;
        }

        .launch-btn:hover {
            background-color: #218838;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        .exam-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .exam-info {
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Generated Exams</h1>
        <div id="examList">
            <!-- Exams will be dynamically populated here -->
        </div>
    </div>

    <script>
        function loadExams() {
            const savedExams = JSON.parse(localStorage.getItem("generatedExams"));
            const examListContainer = $("#examList");

            if (savedExams && savedExams.length > 0) {
                examListContainer.empty();  // Clear the list first
                savedExams.forEach((exam, index) => {
                    const examCard = `
                        <div class="card exam-card" data-index="${index}">
                            <div class="card-body">
                                <h5 class="exam-name">${exam.examName}</h5>
                                <p class="exam-info">Total Questions: ${exam.questions.length}</p>
                                <button class="launch-btn" onclick="launchExam(${index})">Launch Exam</button>
                                <button class="delete-btn" onclick="deleteExam(${index})">Delete Exam</button>
                            </div>
                        </div>
                    `;
                    examListContainer.append(examCard);
                });
            } else {
                examListContainer.append('<p>No exams have been generated yet.</p>');
            }
        }

        function launchExam(examIndex) {
            alert(`Launching exam: ${examIndex}`);
        }

        function deleteExam(examIndex) {
            let exams = JSON.parse(localStorage.getItem("generatedExams"));
            exams.splice(examIndex, 1);
            localStorage.setItem("generatedExams", JSON.stringify(exams));

            // Remove the exam card from the DOM immediately
            $(`.exam-card[data-index="${examIndex}"]`).remove();
            examListContainer.append('<p>No exams have been generated yet.</p>');
        }

        $(document).ready(function () {
            loadExams();
        });
    </script>
</body>
</html>
