<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #302e9d92; padding: 50px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="text-center">Forgot Password</h2>
                        <p class="text-center">Enter your email address below and we'll send you a link to reset your password.</p>
                        <form id="resetPasswordForm">
                            <div class="form-group">
                                <label for="email">Email ID:</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                            <button type="submit" class="btn btn-primary mt-3 w-100">Send Reset Link</button>
                        </form>
                        <p class="mt-3 text-center"><a href="dashboard.html">Back to Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("resetPasswordForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value;

            // In a real application, you would send a request to the backend here to process the reset
            alert(`A password reset link has been sent to ${email}.`);
            
            // Redirect to the login page after sending the reset link
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
